_format_version: "3.0"
_transform: true

services:
  - name: transactions
    url: ${TRANSACTIONS_SERVICE_URL}
    protocol: http
    host: host.docker.internal
    port: 3333
    path: /
    routes:
      - name: api-transactions
        protocols:
          - http
        paths:
          - /transactions

  - name: auth
    url: ${USERS_SERVICE_URL}
    protocol: http
    host: host.docker.internal
    port: 4013
    path: /
    routes:
      - name: api-auth
        protocols:
          - http
        paths:
          - /auth

plugins: 
  - name: cors
    config:
      origins:
        - "*"
      methods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
      headers:
        - Accept
        - Content-Type
        - Authorization
  